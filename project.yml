name: Hedgerow
options:
  bundleIdPrefix: tools.hedgerow
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "3"
packages:
  HedgerowCore:
    path: HedgerowCore
targets:
  Hedgerow:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - Hedgerow
      - Shared
    dependencies:
      - package: HedgerowCore
      # Embedded in the app: rewrites a notification with the real text (HedgerowNotificationService/).
      - target: HedgerowNotificationService
    info:
      # Merged with the keys Xcode generates from the INFOPLIST_KEY_ settings below.
      path: Config/Hedgerow-Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, nb]
        # HedgerowCore only lets a token travel over https, or plain http to a LAN host
        # (isAllowedBaseURL: loopback, RFC 1918, link-local, .local/.lan/.home.arpa/.internal,
        # Tailscale 100.64.0.0/10 and .ts.net). ATS cannot express that list: it would still
        # block http to .lan, .ts.net, .home.arpa, .internal and CGNAT hosts. So ATS is opened
        # here and the app's own rule is the gate; HedgerowHTTP checks it before every request
        # and refuses redirects to another host.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Hedgerow connects to your own servers on your local network.
        # Only the system's HTTPS/TLS (exempt): no export compliance questions on every upload.
        ITSAppUsesNonExemptEncryption: false
        # The Keychain access group with the team prefix resolved at build time (read by AppStorage.swift).
        HedgerowKeychainAccessGroup: $(AppIdentifierPrefix)tools.hedgerow.app
        # Silent `sync` pushes from Postal Pigeon wake the app in the background.
        UIBackgroundModes:
          - remote-notification
    entitlements:
      path: Config/Hedgerow.entitlements
      properties:
        # Shared with the phase 5 widgets: the connection list lives in the App Group container...
        com.apple.security.application-groups:
          - group.tools.hedgerow.app
        # ...and the tokens in this Keychain access group.
        keychain-access-groups:
          - $(AppIdentifierPrefix)tools.hedgerow.app
        # Push notifications through Postal Pigeon. Xcode's automatic signing changes this to
        # `production` for archives (TestFlight, App Store); a build run from Xcode uses the sandbox.
        aps-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tools.hedgerow.app
        DEVELOPMENT_TEAM: 76M3G78HV8
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The catalog is kept by hand (every key "manual"): no Swift symbols generated from its keys
        # (one key, "Open", is a Swift keyword and stops the build when symbols are on).
        STRING_CATALOG_GENERATE_SYMBOLS: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Hedgerow
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
  # Notification Service Extension: wakes up for an alert push, fetches the text from the user's own server
  # with the token in the shared Keychain and rewrites the notification. The logic is NotificationRewriter in
  # HedgerowCore; this target is the thin shell around it.
  HedgerowNotificationService:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - HedgerowNotificationService
      # The App Group file locations and the Keychain access group, the same as the app uses.
      - Shared
    dependencies:
      - package: HedgerowCore
    info:
      path: Config/HedgerowNotificationService-Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, nb]
        ITSAppUsesNonExemptEncryption: false
        HedgerowKeychainAccessGroup: $(AppIdentifierPrefix)tools.hedgerow.app
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    entitlements:
      path: Config/HedgerowNotificationService.entitlements
      properties:
        # The same App Group and Keychain access group as the app: the connection list, the tag
        # registry and the tokens.
        com.apple.security.application-groups:
          - group.tools.hedgerow.app
        keychain-access-groups:
          - $(AppIdentifierPrefix)tools.hedgerow.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tools.hedgerow.app.notification-service
        DEVELOPMENT_TEAM: 76M3G78HV8
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Hedgerow
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
schemes:
  Hedgerow:
    build:
      targets:
        Hedgerow: all
    run:
      config: Debug
    test:
      config: Debug
