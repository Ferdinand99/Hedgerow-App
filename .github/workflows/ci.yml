name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: HedgerowCore tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.2
    defaults:
      run:
        working-directory: HedgerowCore
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run tests
        run: swift test

  app-build:
    name: Hedgerow app build (iOS Simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build
        run: xcodebuild build -scheme Hedgerow -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO
